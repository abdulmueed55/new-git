name: Build check

# Fails if docs/ does not match what build/generate.py produces, so a page
# edited by hand instead of in the generator cannot drift silently.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild the site
        run: python3 build/generate.py

      - name: Audit for keyword stuffing and duplicate pages
        run: python3 build/seo_check.py --strict

      - name: Check the committed output is current
        run: |
          if [ -n "$(git status --porcelain docs)" ]; then
            echo "::error::docs/ is out of date. Run 'python3 build/generate.py' and commit the result."
            git --no-pager diff --stat docs
            exit 1
          fi
          echo "docs/ matches the generator."
